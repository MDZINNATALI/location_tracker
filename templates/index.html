<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px 0;
            transition: transform 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            background: #45a049;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f5f5f5;
            font-size: 14px;
            word-wrap: break-word;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .coords {
            font-weight: bold;
            font-size: 16px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Location Tracker</h1>
        <p>আপনার বর্তমান অবস্থান শেয়ার করুন</p>
        
        <button onclick="sendLocation()">📤 আমার লোকেশন পাঠান</button>
        
        <div id="status">
            ⏳ প্রস্তুত... "Send Location" বাটনে ক্লিক করুন
        </div>
    </div>

    <script>
        async function sendLocation() {
            const statusDiv = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusDiv.innerHTML = '❌ আপনার ব্রাউজার জিপিএস সাপোর্ট করে না';
                statusDiv.className = 'error';
                return;
            }
            
            statusDiv.innerHTML = '📍 জিপিএস লোকেশন নেওয়া হচ্ছে...';
            statusDiv.className = 'info';
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    statusDiv.innerHTML = `📡 লোকেশন পাওয়া গেছে:<br>
                        <span class="coords">অক্ষাংশ: ${lat.toFixed(6)}<br>
                        দ্রাঘিমাংশ: ${lon.toFixed(6)}</span><br>
                        ⏳ সার্ভারে পাঠানো হচ্ছে...`;
                    
                    try {
                        const response = await fetch('/update-location', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                latitude: lat,
                                longitude: lon
                            })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok) {
                            statusDiv.innerHTML = `✅ সফল! আপনার লোকেশন সেভ হয়েছে!<br>
                                📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
                                🗺️ <a href="/get-map" target="_blank">ম্যাপ দেখুন</a>`;
                            statusDiv.className = 'success';
                        } else {
                            statusDiv.innerHTML = '❌ সার্ভার ত্রুটি। আবার চেষ্টা করুন।';
                            statusDiv.className = 'error';
                        }
                    } catch (error) {
                        statusDiv.innerHTML = '❌ সংযোগ সমস্যা! সার্ভার চলছে কিনা চেক করুন।';
                        statusDiv.className = 'error';
                    }
                },
                (error) => {
                    let errorMsg = '';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = 'আপনি লোকেশন অনুমতি দেননি। ব্রাউজার সেটিংস থেকে অনুমতি দিন।';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = 'জিপিএস লোকেশন পাওয়া যাচ্ছে না। ফোনের জিপিএস অন করুন।';
                            break;
                        case error.TIMEOUT:
                            errorMsg = 'টাইম আউট! আবার চেষ্টা করুন।';
                            break;
                        default:
                            errorMsg = error.message;
                    }
                    statusDiv.innerHTML = `❌ ${errorMsg}`;
                    statusDiv.className = 'error';
                }
            );
        }
    </script>
</body>
</html>
