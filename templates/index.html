<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Live Location Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .status-card {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
        }
        .location-info {
            font-size: 14px;
            color: #666;
            margin: 5px 0;
            word-wrap: break-word;
        }
        .coords {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            background: #e8f4e8;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .live-badge {
            background: #ff4444;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.5; }
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px 0;
            transition: transform 0.3s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .link {
            display: inline-block;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Live Location Tracker</h1>
        <div class="live-badge">● LIVE TRACKING</div>
        
        <div class="status-card">
            <div id="status">🟢 ট্র্যাকিং শুরু হচ্ছে...</div>
            <div id="coords" class="coords">-</div>
            <div id="accuracy" class="location-info">-</div>
            <div id="lastUpdate" class="location-info">-</div>
        </div>
        
        <button onclick="sendLocationNow()">📤 এখনই লোকেশন পাঠান</button>
        <br>
        <a href="/map" class="link" target="_blank">🗺️ লাইভ ম্যাপ দেখুন</a>
        <br>
        <a href="/static-map" class="link" target="_blank">🗺️ স্ট্যাটিক ম্যাপ</a>
    </div>

    <script>
        let watchId = null;
        let updateCount = 0;
        
        // অটো লোকেশন ট্র্যাকিং শুরু করুন
        function startLiveTracking() {
            if (!navigator.geolocation) {
                document.getElementById('status').innerHTML = '❌ আপনার ব্রাউজার GPS সাপোর্ট করে না';
                return;
            }
            
            document.getElementById('status').innerHTML = '📍 GPS লোকেশন নেওয়া হচ্ছে...';
            
            watchId = navigator.geolocation.watchPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    updateCount++;
                    
                    // UI আপডেট করুন
                    document.getElementById('coords').innerHTML = `${lat.toFixed(6)}°, ${lon.toFixed(6)}°`;
                    document.getElementById('accuracy').innerHTML = `📡 Accuracy: ±${Math.round(accuracy)}m`;
                    document.getElementById('lastUpdate').innerHTML = `🕐 শেষ আপডেট: ${new Date().toLocaleTimeString()}`;
                    document.getElementById('status').innerHTML = `🟢 ট্র্যাকিং সক্রিয় (${updateCount} বার আপডেট)`;
                    
                    // সার্ভারে পাঠান
                    try {
                        const response = await fetch('/update-location', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                latitude: lat,
                                longitude: lon,
                                accuracy: accuracy
                            })
                        });
                        
                        if (response.ok) {
                            document.getElementById('status').innerHTML = `✅ লোকেশন পাঠানো হয়েছে (${updateCount})`;
                            setTimeout(() => {
                                document.getElementById('status').innerHTML = `🟢 ট্র্যাকিং সক্রিয় (${updateCount} বার আপডেট)`;
                            }, 1000);
                        }
                    } catch (error) {
                        console.error('Send error:', error);
                    }
                },
                (error) => {
                    let errorMsg = '';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = 'আপনি লোকেশন অনুমতি দেননি। ব্রাউজার সেটিংস থেকে অনুমতি দিন।';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = 'জিপিএস লোকেশন পাওয়া যাচ্ছে না। ফোনের জিপিএস অন করুন।';
                            break;
                        case error.TIMEOUT:
                            errorMsg = 'টাইম আউট! আবার চেষ্টা করুন।';
                            break;
                        default:
                            errorMsg = error.message;
                    }
                    document.getElementById('status').innerHTML = `❌ ${errorMsg}`;
                    document.getElementById('coords').innerHTML = 'GPS না পাওয়া গেছে';
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        }
        
        // ম্যানুয়ালি লোকেশন পাঠান
        async function sendLocationNow() {
            if (!navigator.geolocation) {
                alert("GPS সাপোর্ট করে না");
                return;
            }
            
            document.getElementById('status').innerHTML = '📍 এক্ষুণি লোকেশন নেওয়া হচ্ছে...';
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    const response = await fetch('/update-location', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            latitude: lat,
                            longitude: lon,
                            accuracy: position.coords.accuracy
                        })
                    });
                    
                    if (response.ok) {
                        document.getElementById('status').innerHTML = '✅ লোকেশন পাঠানো হয়েছে!';
                        setTimeout(() => {
                            document.getElementById('status').innerHTML = `🟢 ট্র্যাকিং সক্রিয় (${updateCount} বার আপডেট)`;
                        }, 2000);
                    }
                },
                (error) => {
                    document.getElementById('status').innerHTML = '❌ লোকেশন নেওয়া যায়নি';
                }
            );
        }
        
        // পেজ লোড হলে শুরু করুন
        startLiveTracking();
    </script>
</body>
</html>
